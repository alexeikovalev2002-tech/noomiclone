<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#83d5f4">
<title>Bar Swing — Yandex Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game">
  <canvas id="view" aria-label="Игровое поле"></canvas>
  <div class="hud"><div class="brand">BAR <b>SWING</b></div><div class="stats"><span id="state">ДЕРЖИТСЯ</span><strong><span id="score">0</span><small> ПЕРЕХВАТОВ</small></strong></div></div>
  <div class="controls left"><button id="left" aria-label="Влево">◀</button><button id="right" aria-label="Вправо">▶</button></div>
  <div class="controls right"><button id="grab" class="main-btn">ОТПУСТИТЬ</button><button data-pose="arch">ПРОГИБ</button><button data-pose="tuck">ГРУППИРОВКА</button><button data-pose="straight" class="active">ПРЯМОЕ ТЕЛО</button><button id="restart" class="reset">↻ СБРОС</button></div>
  <div class="hint" id="hint">A / D или ← / → — раскачка　 •　 ПРОБЕЛ — отпустить / схватиться　 •　 R — сброс</div>
</main>
<script src="game.js"></script>
</body>
</html>
