<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bar Swing — prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#76c8f2;font-family:Arial,sans-serif;touch-action:none}#game{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;color:#111}.score{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:clamp(17px,2.5vw,27px);font-weight:700;letter-spacing:2px;background:#ffffff9c;padding:4px 12px;border-radius:3px}.left,.right{position:absolute;top:8px;bottom:8px;width:18%;display:flex;flex-direction:column;gap:7px}.left{left:8px}.right{right:8px}.btn{pointer-events:auto;border:1px solid #ffffff80;background:#ffffff75;color:#111;font-size:clamp(15px,2.3vw,24px);letter-spacing:1px;display:grid;place-items:center;min-height:0;flex:1;user-select:none;-webkit-user-select:none;backdrop-filter:blur(3px)}.btn:active,.btn.on{background:#ffffffc9}.bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.small{border:1px solid #ffffff90;background:#ffffff90;padding:10px 14px;font-size:16px;border-radius:4px}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);margin-bottom:48px;background:#ffffff8a;padding:5px 9px;font-size:12px;white-space:nowrap}.hidden{display:none}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="score"><span id="score">0</span> ПЕРЕХВАТОВ</div><div class="left"><div class="btn" id="release">Отпустить</div><div class="btn" id="reset">Сброс</div></div><div class="right"><div class="btn pose" data-pose="arch">Прогиб</div><div class="btn pose" data-pose="tuck">Группировка</div><div class="btn pose" data-pose="straight">Прямое тело</div></div><div class="hint" id="hint">Зажми ПРОБЕЛ / кнопку «Отпустить», чтобы отпустить перекладину</div><div class="bottom"><button class="small" id="menu">☰</button><button class="small" id="restart">↻ Заново</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x76c8f2);scene.fog=new THREE.Fog(0x76c8f2,22,65);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(0,5.4,13);
scene.add(new THREE.HemisphereLight(0xffffff,0x8c9ba7,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,8);sun.castShadow=true;scene.add(sun);
const mat=(c,rough=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});const groundMat=mat(0xd24e45),concrete=mat(0xb9b5a9),black=mat(0x151719,.55),barMat=mat(0x777d80,.35);
function box(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
box(0,-.25,0,50,.5,30,groundMat);box(-7,4.1,-1,1.2,8,1.8,concrete);box(7,4.6,-1,1.5,9,2,concrete);box(13,3,-1,1,6,2,concrete);
// bars and support poles
const bars=[];function bar(x,y,z,len=5){box(x,y,z,.12,y,.12,concrete).position.set(x,y/2,z);const b=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,len,12),barMat);b.rotation.z=Math.PI/2;b.position.set(x+len/2,y,z);b.castShadow=true;scene.add(b);bars.push({x:x+len/2,y,z,len});}
bar(-10,5.8,0,6);bar(-3,6.1,0,6);bar(4,5.8,0,6);bar(11,6.2,0,6);
// stylized articulated ragdoll represented by linked verlet joints
const names=['head','neck','shoulder','hip','leftElbow','leftHand','rightElbow','rightHand','leftKnee','leftFoot','rightKnee','rightFoot'];
let p=[],old=[],links=[],meshes=[],held=true,grabbed=1,score=0,pose='straight',spin=0,airTime=0;
const linkDefs=[['head','neck',.32],['neck','shoulder',.38],['shoulder','hip',.85],['shoulder','leftElbow',.48],['leftElbow','leftHand',.43],['shoulder','rightElbow',.48],['rightElbow','rightHand',.43],['hip','leftKnee',.58],['leftKnee','leftFoot',.55],['hip','rightKnee',.58],['rightKnee','rightFoot',.55]];
const idx=Object.fromEntries(names.map((n,i)=>[n,i]));
function init(){p=[[-2,4.8,0],[-2,4.45,0],[-2,4.05,0],[-2,3.2,0],[-2.4,3.8,0],[-2.8,3.55,0],[-1.6,3.8,0],[-1.2,3.55,0],[-2.35,2.6,0],[-2.55,2.05,0],[-1.65,2.6,0],[-1.45,2.05,0]].map(a=>new THREE.Vector3(...a));old=p.map(v=>v.clone());links=linkDefs.map(([a,b,l])=>({a:idx[a],b:idx[b],len:l}));held=true;grabbed=1;spin=0;airTime=0;score=0;document.querySelector('#score').textContent=score;}
function capsuleBetween(a,b,r,m){const g=new THREE.CylinderGeometry(r,r,1,10);const o=new THREE.Mesh(g,m);o.castShadow=true;scene.add(o);meshes.push({o,a,b,r});return o;}
// head, body and limbs
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),black);head.castShadow=true;scene.add(head);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.65,5,10),black);torso.castShadow=true;scene.add(torso);
const limbMeshes=linkDefs.filter(d=>!['head','neck'].includes(d[0])).map(d=>capsuleBetween(new THREE.Vector3(),new THREE.Vector3(),.105,black));
function sync(){head.position.copy(p[idx.head]);torso.position.copy(p[idx.shoulder]).add(p[idx.hip]).multiplyScalar(.5);torso.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p[idx.shoulder].clone().sub(p[idx.hip]).normalize());let k=0;for(const [a,b] of linkDefs){if(a==='head'||a==='neck')continue;const A=p[idx[a]],B=p[idx[b]],m=limbMeshes[k++];m.position.copy(A).add(B).multiplyScalar(.5);m.scale.y=A.distanceTo(B);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());}}
init();
function nearestBar(){let best=0,d=1e9;p[idx.leftHand].set(p[idx.leftHand].x,p[idx.leftHand].y,p[idx.leftHand].z);bars.forEach((b,i)=>{const x=b.x-b.len/2+0.2;const dx=Math.abs(p[idx.leftHand].x-x),dy=Math.abs(p[idx.leftHand].y-b.y);if(dx+dy<d){d=dx+dy;best=i;}});return best;}
function release(){if(!held)return;held=false;airTime=0;const v=p[idx.shoulder].clone().sub(old[idx.shoulder]);p.forEach((vtx,i)=>{old[i].copy(vtx).sub(v.clone().multiplyScalar(.7));});}
function reset(){init();}
function poseSet(v){pose=v;document.querySelectorAll('.pose').forEach(b=>b.classList.toggle('on',b.dataset.pose===v));}
function step(dt){const sub=2, h=dt/sub;for(let s=0;s<sub;s++){
 if(held){const b=bars[grabbed];const target=new THREE.Vector3(b.x-b.len/2+.35,b.y-.1,0);p[idx.leftHand].lerp(target,.65);old[idx.leftHand].copy(p[idx.leftHand]);p[idx.rightHand].lerp(target.clone().add(new THREE.Vector3(.65,0,0)),.65);old[idx.rightHand].copy(p[idx.rightHand]);
 const sway=Math.sin(performance.now()*.0017)*.6;p[idx.shoulder].x+=sway*.004;p[idx.hip].x+=sway*.006;
 } else {airTime+=h;for(let i=0;i<p.length;i++){const v=p[i].clone().sub(old[i]).multiplyScalar(.995);old[i].copy(p[i]);p[i].add(v);p[i].y-=9.8*h*h;} }
 // trick pose offsets
 const hip=p[idx.hip],sh=p[idx.shoulder];if(pose==='tuck'){p[idx.leftKnee].lerp(hip.clone().add(new THREE.Vector3(-.25,-.1,0)),.12);p[idx.rightKnee].lerp(hip.clone().add(new THREE.Vector3(.25,-.1,0)),.12);}else if(pose==='arch'){p[idx.hip].z+=.006;}
 for(let it=0;it<7;it++){for(const l of links){const a=p[l.a],b=p[l.b],d=b.clone().sub(a),len=d.length()||.001;const corr=d.multiplyScalar((len-l.len)/len*.5);if(!(held&&(l.a===idx.leftHand||l.a===idx.rightHand))){a.add(corr);b.sub(corr);}}
 for(let i=0;i<p.length;i++){if(p[i].y<.45){p[i].y=.45;old[i].y=Math.max(old[i].y,p[i].y);}}}
 if(!held&&airTime>.45&&p[idx.hip].y<.6){held=true;grabbed=(grabbed+1)%bars.length;score++;document.querySelector('#score').textContent=score;const b=bars[grabbed];p[idx.leftHand].set(b.x-b.len/2+.3,b.y,0);old[idx.leftHand].copy(p[idx.leftHand]);}
 }
}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.033);last=now;step(dt);sync();const focus=p[idx.hip];camera.position.lerp(new THREE.Vector3(focus.x,focus.y+3.2,13),.035);camera.lookAt(focus.x,focus.y+1.2,0);renderer.render(scene,camera);}requestAnimationFrame(animate);
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn();});}bind('release',release);bind('reset',reset);bind('restart',reset);bind('menu',()=>document.querySelector('#hint').textContent='Управление: ПРОБЕЛ — отпустить • R — сброс • 1/2/3 — позы');
document.querySelectorAll('.pose').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();poseSet(b.dataset.pose);}));window.addEventListener('keydown',e=>{if(e.code==='Space')release();if(e.key.toLowerCase()==='r')reset();if(e.key==='1')poseSet('arch');if(e.key==='2')poseSet('tuck');if(e.key==='3')poseSet('straight');});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setSize(innerWidth,innerHeight);
</script></body></html>
