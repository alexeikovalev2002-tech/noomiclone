<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="yandex-games-sdk" content="true"><title>Ragdoll Bars — Yandex Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"><canvas id="view"></canvas>
  <div class="hud top"><div class="counter"><b id="flips">0</b><span>переворотов</span></div><div class="hint" id="hint">Подойди к перекладине и нажми «Захватить»</div></div>
  <div class="left-controls"><button id="grab" class="glass tall">Захватить</button><button id="reset" class="glass tall">Сброс</button></div>
  <div class="right-controls"><button data-pose="arch" class="glass">Прогиб</button><button data-pose="tuck" class="glass">Группировка</button><button data-pose="straight" class="glass">Прямое тело</button></div>
  <button id="menu" class="menu glass" aria-label="Меню">☰</button>
  <div id="pause" class="pause hidden"><div class="panel"><h2>RAGDOLL BARS</h2><p>Прототип физической игры</p><button id="resume">Продолжить</button><button id="restart">Начать заново</button><small>WASD / стрелки — раскачка · Пробел — захват / отпускание · 1–3 — позы</small></div></div>
  <div class="bottom-tip">WASD / ← → — раскачка · Пробел — захват / отпускание · R — сброс</div>
</div>
<script type="module" src="game.js"></script>
</body></html>
